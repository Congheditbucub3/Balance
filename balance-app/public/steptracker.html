<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Step Quest - Balance</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="steptracker.css">
</head>
<body>
    <div class="container">
        <span class="eyebrow">Step Quest</span>
        <h1>Walk your way to credits</h1>

        <div class="progress-container">
            <svg class="progress-ring" width="250" height="250">
                <circle class="ring-background" cx="125" cy="125" r="110"></circle>
                <circle class="ring-fill" id="progressRing" cx="125" cy="125" r="110"></circle>
            </svg>

            <div class="step-display">
                <span id="stepCount">0</span>
                <span class="label">/ 10,000</span>
            </div>
        </div>

        <button id="startBtn">Start Walking</button>
        <p id="statusMsg">Ready to track</p>
        <p id="creditMsg"></p>
        <p id="pendingMsg"></p>

        <button id="demoBtn">
            +100 steps (desktop demo — real motion sensors need a phone)
        </button>

        <a href="dashboard.html" class="back-link">&larr; Back to dashboard</a>
    </div>

    <script src="app.js"></script>
    <script src="offline-queue.js"></script>
    <script src="steptracker.js"></script>
</body>
</html>
