<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Balance</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { padding-bottom: 60px; }
  .hero { padding: 100px 0 8px; }
  .hero .eyebrow { margin-bottom: 8px; }
  .hero h1 { font-size: 2.1rem; margin-bottom: 4px; }
  .hero p { color: var(--text-muted); font-size: 0.95rem; }

  .section-label {
    font-family: var(--font-heading);
    font-size: 0.95rem;
    font-weight: 700;
    margin: 32px 0 14px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
  }

  .nav-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 520px) { .nav-grid { grid-template-columns: 1fr; } }

  .nav-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px;
    text-decoration: none;
    color: var(--text);
    display: block;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .nav-card:hover { transform: translateY(-3px); border-color: var(--border-strong); }
  .nav-card .icon-badge {
    width: 42px; height: 42px; border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; margin-bottom: 14px;
  }
  .nav-card .icon-badge.lime { background: var(--lime-dim); }
  .nav-card .icon-badge.blue { background: var(--blue-dim); }
  .nav-card .nc-title { font-family: var(--font-heading); font-weight: 700; font-size: 1.05rem; }
  .nav-card .nc-sub { font-size: 0.8rem; color: var(--text-faint); margin-top: 4px; }

  .progress-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
</style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <span class="eyebrow" id="roleEyebrow">Balance</span>
      <h1 id="greeting">Welcome</h1>
      <p id="subGreeting"></p>
    </div>

    <div id="statsSection" style="display:none;">
      <div class="section-label">Your progress</div>
      <div class="stat-grid" id="statGrid"></div>

      <div class="card" style="margin-top:16px;">
        <div class="progress-row">
          <span>Earned today</span>
          <span id="dailyEarnedLabel">0 / 100 credits</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="dailyEarnedBar" style="width:0%"></div></div>
      </div>
    </div>

    <div class="section-label" id="quickLabel">Quick actions</div>
    <div class="nav-grid" id="cardGrid"></div>

    <div id="teacherStats" style="display:none; margin-top:16px;"></div>
  </div>

  <script src="app.js"></script>
  <script>
    (async function () {
      const user = await requireAuth();
      if (!user) return;

      document.getElementById('greeting').textContent = `Hi ${user.name.split(' ')[0]} 👋`;
      const cards = document.getElementById('cardGrid');

      if (user.role === 'student') {
        document.getElementById('roleEyebrow').textContent = 'Student';
        document.getElementById('subGreeting').textContent = "Here's where your steps, sessions and homework add up.";

        cards.innerHTML = `
          <a class="nav-card" href="steptracker.html">
            <div class="icon-badge lime">🚶</div>
            <div class="nc-title">Step Quest</div>
            <div class="nc-sub">50 credits / 10,000 steps</div>
          </a>
          <a class="nav-card" href="timer.html">
            <div class="icon-badge lime">⏱️</div>
            <div class="nc-title">Focus Timer</div>
            <div class="nc-sub">+5 credits / session, up to 3/day</div>
          </a>
          <a class="nav-card" href="homework.html">
            <div class="icon-badge blue">📚</div>
            <div class="nc-title">Homework Hub</div>
            <div class="nc-sub">Submit & earn credits</div>
          </a>
          <a class="nav-card" href="#" id="nightClaim">
            <div class="icon-badge blue">🌙</div>
            <div class="nc-title">Log-off Bonus</div>
            <div class="nc-sub">Claim between 6–10 AM</div>
          </a>
        `;
        document.getElementById('nightClaim').addEventListener('click', async (e) => {
          e.preventDefault();
          const res = await fetch('/api/nightmode/claim', { method: 'POST' });
          const data = await res.json();
          alert(data.credits_granted > 0 ? `+${data.credits_granted} credits for a healthy log-off!` : (data.reason || 'Not available right now.'));
        });

        // Pull today's steps + all-time progress stats in parallel
        const [stepsRes, progressRes] = await Promise.all([
          fetch('/api/steps/today'),
          fetch('/api/stats/progress'),
        ]);
        const stepsData = stepsRes.ok ? await stepsRes.json() : { step_count: 0, goal: 10000 };
        const progress = progressRes.ok ? await progressRes.json() : null;

        const statGrid = document.getElementById('statGrid');
        statGrid.innerHTML = `
          <div class="stat-tile">
            <div class="stat-number">${user.wallet ? user.wallet.balance : 0}</div>
            <div class="stat-label">Credit balance</div>
          </div>
          <div class="stat-tile">
            <div class="stat-number">${stepsData.step_count.toLocaleString()}</div>
            <div class="stat-label">Steps today</div>
          </div>
          <div class="stat-tile">
            <div class="stat-number blue">${progress ? progress.focusSessionsCompleted : 0}</div>
            <div class="stat-label">Focus sessions (all-time)</div>
          </div>
          <div class="stat-tile">
            <div class="stat-number blue">${progress ? progress.homeworkCompleted : 0}</div>
            <div class="stat-label">Homework done (all-time)</div>
          </div>
        `;

        const earned = user.wallet ? user.wallet.daily_earned_credits : 0;
        document.getElementById('dailyEarnedLabel').textContent = `${earned} / 100 credits`;
        document.getElementById('dailyEarnedBar').style.width = `${Math.min(100, earned)}%`;

        document.getElementById('statsSection').style.display = 'block';
        document.getElementById('quickLabel').textContent = 'Quick actions';
      } else {
        document.getElementById('roleEyebrow').textContent = 'Teacher';
        document.getElementById('subGreeting').textContent = 'Manage assignments and keep an eye on class wellness.';
        document.getElementById('quickLabel').textContent = 'Quick actions';

        cards.innerHTML = `
          <a class="nav-card" href="homework.html">
            <div class="icon-badge blue">📚</div>
            <div class="nc-title">Homework Hub</div>
            <div class="nc-sub">Create & grade assignments</div>
          </a>
          <a class="nav-card" href="#" id="viewInsights">
            <div class="icon-badge lime">📊</div>
            <div class="nc-title">Wellness Insights</div>
            <div class="nc-sub">Anonymized class trends</div>
          </a>
        `;
        document.getElementById('viewInsights').addEventListener('click', async (e) => {
          e.preventDefault();
          const res = await fetch('/api/teacher/wellness-summary');
          const d = await res.json();
          const box = document.getElementById('teacherStats');
          box.innerHTML = `
            <div class="section-label">Class wellness (today)</div>
            <div class="stat-grid">
              <div class="stat-tile"><div class="stat-number">${d.totalStudents}</div><div class="stat-label">Students</div></div>
              <div class="stat-tile"><div class="stat-number">${d.avgStepsToday}</div><div class="stat-label">Avg steps today</div></div>
              <div class="stat-tile"><div class="stat-number blue">${d.pctMetStepGoalToday}%</div><div class="stat-label">Met step goal</div></div>
              <div class="stat-tile"><div class="stat-number blue">${d.pctLoggedOffOnTimeToday}%</div><div class="stat-label">Logged off overnight</div></div>
            </div>
          `;
          box.style.display = 'block';
        });
      }
    })();
  </script>
</body>
</html>
